version: '3'

vars:
  # AWS Emulator is pinned so every run, here and in CI, tests against the same
  # emulator. Versions: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/versions.json
  # AWS only ships security fixes in the latest release, so raise this regularly.
  EMULATOR_VERSION: 1.0.365
  EMULATOR_BASE: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS
  # The AWS publishing key that signs the emulator packages (from its user guide).
  EMULATOR_KEY_FINGERPRINT: 98BCF336A3BE53B734E967C52E5BF49BD940F624
  EMULATOR_PORT: '{{.EMULATOR_PORT | default "9297"}}'
  # Prism serves a mock of the contract. Only `task mock` uses it, so it is
  # fetched on demand at this version rather than installed with the project.
  PRISM_VERSION: 5.14.2
  # schemathesis generates the fuzz requests. An exact version, so the fuzz gate
  # only changes what it sends or checks in a commit; it runs through uvx.
  SCHEMATHESIS_VERSION: 4.33.4
  MOCK_PORT: '{{.MOCK_PORT | default "4010"}}'
  # component:data:start
  # The version of the Open Data Contract Standard specs/datacontract.v<N>.yaml are
  # written in: the one place it is chosen. Moving to the next is this line,
  # the contract's apiVersion, and whatever `task data:lint` then says.
  ODCS_VERSION: v3.2.0
  # The Data Contract CLI lints, compares and tests the data contract; DuckDB
  # queries the data and Harlequin browses it, on the same DuckDB. Exact
  # versions; all three run through uvx.
  DATACONTRACT_CLI_VERSION: 1.2.10
  DUCKDB_VERSION: 2.0.0
  HARLEQUIN_VERSION: 2.17.0
  # component:data:end

env:
  # cucumber and the scripts load TypeScript directly.
  NODE_OPTIONS: --import tsx
  # The emulator image local/stack.mjs runs on macOS and Windows. (Not named
  # EMULATOR_VERSION: the emulator workflow reads a change to that line as the pin moving.)
  EMULATOR_IMAGE: 'aws-emulator:{{.EMULATOR_VERSION}}'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install the npm dependencies
    env:
      NODE_OPTIONS: ''
    cmds:
      - npm ci
      # What an optional component installs for itself.
      - node --import tsx scripts/components.ts run install
    sources:
      - package-lock.json
      - components.json
      - .components
      - tools/*/package-lock.json
    generates:
      - node_modules/.package-lock.json

  generate:
    desc: Generate the runtime contract, its types and the route table from every specs/openapi.v<N>.yaml
    deps: [install]
    cmds:
      - node scripts/generate.ts
      # What an optional component generates from a contract of its own.
      - node scripts/components.ts run generate
    sources:
      - specs/*.yaml
      - scripts/generate.ts
      - scripts/contracts.ts
      - tools/**/*.ts
    generates:
      - src/generated/openapi.json
      - src/generated/api.d.ts
      - src/generated/routes.ts

  skeleton:check:
    desc: Gate - no skeleton file differs from skeleton.lock; the skeleton is the same for every API
    deps: [install]
    cmds:
      - node scripts/skeleton.ts check

  skeleton:lock:
    desc: Accept the skeleton as it is now - a deliberate step for a person, after changing the skeleton on purpose
    deps: [install]
    cmds:
      - node scripts/skeleton.ts lock

  docs:check:
    desc: Gate - AGENTS.md, the skills, the README and the guides are within their line budgets, and their links resolve
    deps: [install]
    cmds:
      - node scripts/docs-check.ts

  # component:asyncapi:start
  asyncapi:install:
    desc: Install AsyncAPI's own tools (parser, diff, Modelina) - a package of their own in tools/asyncapi, so they leave with the component
    # task install runs this (what a component installs for itself), so the
    # tasks below depend on install alone and there are never two at once.
    env:
      NODE_OPTIONS: ''
    cmds:
      - npm ci --prefix tools/asyncapi
    sources:
      - tools/asyncapi/package-lock.json
    generates:
      - tools/asyncapi/node_modules/.package-lock.json

  asyncapi:check:
    desc: Gate - every specs/asyncapi.v<N>.yaml is a valid AsyncAPI 3 contract of major N with versioned names, and every operation is covered by a tagged scenario (nothing to do without one)
    deps: [install]
    cmds:
      - node tools/asyncapi/asyncapi.ts check

  asyncapi:lint:
    desc: Gate - every major's AsyncAPI contract meets the house rules (rules/asyncapi.yaml) and this API's own (.spectral.asyncapi.yaml); warnings fail
    deps: [install]
    env:
      NODE_OPTIONS: ''
    cmds:
      - |
        set -- specs/asyncapi.v*.yaml
        test -e "$1" || { echo "asyncapi:lint - no specs/asyncapi.v<N>.yaml, so this API has no asynchronous side to check"; exit 0; }
        rules=rules/asyncapi.yaml; test -f .spectral.asyncapi.yaml && rules=.spectral.asyncapi.yaml
        node --import tsx scripts/rulesets.ts "$rules" rules/asyncapi.yaml || exit 1
        npx spectral lint "$@" --ruleset "$rules" --fail-severity warn

  asyncapi:compat:
    desc: Gate - each AsyncAPI major is compared with what was published of it, and its info.version is bumped to match; a breaking change is a new version of the event, or a new major file
    deps: [install]
    cmds:
      - node tools/asyncapi/asyncapi.ts compat

  asyncapi:generate:
    desc: Generate the resolved AsyncAPI contract, the message types and the table of operations into src/generated/ (task generate runs it)
    deps: [install]
    cmds:
      - node tools/asyncapi/asyncapi.ts generate

  asyncapi:examples:
    desc: Write messages/ - an example of every message in the AsyncAPI contract, for whoever sends or consumes one before the API exists
    deps: [install]
    cmds:
      - node tools/asyncapi/asyncapi.ts examples

  asyncapi:examples:check:
    desc: Gate - the committed messages/ match the AsyncAPI contract (run task asyncapi:examples and commit if not)
    deps: [install]
    cmds:
      - node tools/asyncapi/asyncapi.ts examples check
  # component:asyncapi:end

  # component:consume:start
  consume:generate:
    desc: Generate src/generated/consumers.ts - every receive operation of the AsyncAPI contract wired to its file in src/consumers/ (task generate runs it)
    cmds:
      - node scripts/consume.ts generate

  consume:scaffold:
    desc: Write a typed stub in src/consumers/ for every receive operation without a file (task scaffold runs it)
    cmds:
      - node scripts/consume.ts scaffold

  consume:check:
    desc: Gate - every receive operation of the AsyncAPI contract was delivered a message by a scenario in the last full feature run
    cmds:
      - node scripts/consume.ts check

  queue:send:
    desc: Send a message to the API's queue - an example from messages/ by name (task queue:send -- beer_rated), or a file of your own (ENV=local|aws, default local)
    deps: [install]
    cmds:
      - node local/queue.ts send {{.CLI_ARGS}}

  queue:peek:
    desc: Show how many messages are waiting on the queue and the dead-letter queue, and how many are being handled - counts only, so looking costs a message none of its tries (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/queue.ts peek

  dlq:peek:
    desc: Show the messages on the dead-letter queue and why each is there, without taking them (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/queue.ts dead-letters

  dlq:redrive:
    desc: Move the dead-letter queue's messages back to the queue, to be handled again - after fixing what failed them (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/queue.ts redrive
  # component:consume:end

  # component:publish:start
  publish:generate:
    desc: Generate src/generated/events.ts - a typed function for every event the AsyncAPI contract says the API publishes (task generate runs it)
    cmds:
      - node scripts/publish.ts generate

  publish:check:
    desc: Gate - every event the AsyncAPI contract says the API publishes was seen published by a scenario in the last full feature run
    cmds:
      - node scripts/publish.ts check

  events:tail:
    desc: Follow the events the API publishes, as they are published - all of them, or one type (task events:tail -- <type>) (ENV=local|aws, default local)
    deps: [install]
    cmds:
      - node local/events.ts tail {{.CLI_ARGS}}

  outbox:list:
    desc: Show the events written but not yet on the bus; none means the forwarder is up to date (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/events.ts outbox

  events:unpublished:
    desc: Show the events that could not be published and why each is there, without taking them (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/events.ts unpublished

  events:retry:
    desc: Publish the events that could not be published again, after fixing what stopped them; each leaves the list once it is on the bus. Also publishes what has waited in the outbox for over five minutes (ENV=local|aws)
    deps: [install]
    cmds:
      - node local/events.ts retry
  # component:publish:end

  # component:data:start
  data:generate:
    desc: Write into every specs/datacontract.v<N>.yaml (starting v0 when there is none) what the AsyncAPI contract decides - a schema object for every event the API publishes, each property's type and whether it is required. What a person wrote is kept; with no file yet, it starts one
    deps: [generate]
    env:
      ODCS_VERSION: '{{.ODCS_VERSION}}'
    cmds:
      - node scripts/data.ts generate

  data:layout:
    desc: Generate src/generated/data.json - each live data contract major's schema objects, which the compactor types its Parquet by (task generate runs it)
    cmds:
      - node scripts/data.ts layout

  data:compact:
    desc: Compact the events kept as data into Parquet now, as the daily schedule does - the last DATA_DAYS whole days (3) and today - on the local stack or the deployed one (ENV=local|aws, default local)
    deps: [install]
    cmds:
      - node local/data.ts compact

  data:lint:
    desc: Gate - every major of the data contract is valid ODCS (the Data Contract CLI) and meets the house rules (rules/datacontract.yaml) and this API's own (.spectral.datacontract.yaml); warnings fail
    deps: [install]
    env:
      NODE_OPTIONS: ''
    cmds:
      - |
        set -e
        set -- specs/datacontract.v*.yaml
        test -e "$1" || { echo "data:lint - no specs/datacontract.v<N>.yaml, so the events this API publishes are not kept as data"; exit 0; }
        for contract in "$@"; do uvx --from "datacontract-cli[duckdb]=={{.DATACONTRACT_CLI_VERSION}}" datacontract lint "$contract"; done
        rules=rules/datacontract.yaml; test -f .spectral.datacontract.yaml && rules=.spectral.datacontract.yaml
        node --import tsx scripts/rulesets.ts "$rules" rules/datacontract.yaml
        npx spectral lint "$@" --ruleset "$rules" --fail-severity warn

  data:check:
    desc: Gate - every major of the data contract is of the pinned ODCS version, its version and id and locations carry its major (/v<N>/, one bucket), describes every event the AsyncAPI contract says the API publishes exactly as it has them, and says where the data is kept, for how long and how fresh
    deps: [generate]
    env:
      ODCS_VERSION: '{{.ODCS_VERSION}}'
    cmds:
      - node scripts/data.ts check

  data:compat:
    desc: Gate - each data contract major is compared with what was published of it (the Data Contract CLI), and its version is bumped to match; a breaking change is a new major file, whose data lands beside the old
    deps: [install]
    env:
      DATACONTRACT_CLI_VERSION: '{{.DATACONTRACT_CLI_VERSION}}'
    cmds:
      - node scripts/data.ts compat

  data:test:
    desc: Gate - the events that landed in S3 keep the data contract, schema and quality rules (the Data Contract CLI), tested where they are - nothing is copied. In acceptance it tests what the scenarios published, every one of which must have landed; ENV=aws tests the deployed stack's last DATA_DAYS days (2). Gzipped data (data_compression = GZIP) can only be tested from a copy - made for the local stack, and for ENV=aws only with DATA_COPY=yes - which is private and removed when the test ends
    env:
      DATACONTRACT_CLI_VERSION: '{{.DATACONTRACT_CLI_VERSION}}'
    cmds:
      - node local/data.ts test

  data:query:
    desc: Query the events kept in S3 with SQL through DuckDB, a view per event already defined, <event> over the Parquet and <event>_raw over the last 2 days of raw JSON (DATA_RAW_DAYS) - task data:query -- "select * from beer_rated_v1"; with no SQL, its shell. The newest data contract major, or DATA_MAJOR=v<N> (ENV=local|aws, default local)
    interactive: true
    env:
      DUCKDB_VERSION: '{{.DUCKDB_VERSION}}'
    cmds:
      - node local/data.ts query {{.CLI_ARGS}}

  data:browse:
    desc: Browse the events kept in S3 in Harlequin, with the same views (ENV=local|aws, default local)
    interactive: true
    env:
      DUCKDB_VERSION: '{{.DUCKDB_VERSION}}'
      HARLEQUIN_VERSION: '{{.HARLEQUIN_VERSION}}'
    cmds:
      - node local/data.ts browse
  # component:data:end

  component:list:
    desc: The template's optional components, and whether this repository has each
    deps: [install]
    cmds:
      - node scripts/components.ts list

  component:remove:
    desc: Remove an optional component this API does not need - its files, sections, skills and Renovate rules (task component:remove -- <name>); refused while another that needs it remains
    deps: [install]
    cmds:
      - node scripts/components.ts remove {{.CLI_ARGS}}

  component:add:
    desc: Bring back a removed component, and what it needs, as the template has it now (task component:add -- <name>); no skeleton:lock needed
    deps: [install]
    cmds:
      - node scripts/components.ts add {{.CLI_ARGS}}

  component:acceptance:
    desc: Gate - what the optional components hold the last feature run to; used by acceptance, against a stack that is already up
    cmds:
      - node scripts/components.ts run acceptance

  component:gates:
    desc: Gate - the gates the optional components still in this repository add to task ci
    deps: [install]
    cmds:
      - node scripts/components.ts run ci

  skills:check:
    desc: Gate - every skill listed in skills.json is in .claude/skills/, unedited, and at the commit its source is pinned to
    deps: [install]
    cmds:
      - node scripts/skills.ts check

  skills:fetch:
    desc: Copy the skills listed in skills.json from their sources at the pinned commits - run it when skills:check says a source has moved, and commit the result
    deps: [install]
    cmds:
      - node scripts/skills.ts fetch

  skills:update:
    desc: Move every skill source to the head of its branch and fetch - what Renovate proposes, done by hand
    deps: [install]
    cmds:
      - node scripts/skills.ts update

  skills:add:
    desc: Add a skill for this API - one the template offers (task skills:add -- <name>), one from a git repository (-- <name> --repository <url> --path <dir>), or your own (-- <name> --manual)
    deps: [install]
    cmds:
      - node scripts/skills.ts add {{.CLI_ARGS}}

  adopt:
    desc: Run once, after the first spec - turn a repository created from the template into the API's own (removes template-only files and sections, writes the README)
    deps: [generate]
    cmds:
      - node scripts/adopt.ts

  steps:check:
    desc: Gate - every step definition is used by a sentence in the feature files
    deps: [generate]
    cmds:
      - node scripts/steps-check.ts

  responses:check:
    desc: Gate - every response the contract documents was returned to a scenario in the last full feature run
    cmds:
      - node scripts/responses-check.ts

  scaffold:
    desc: Write what follows from the specs - a typed stub for every operation without a file, a pending step for every unbound sentence
    deps: [generate]
    cmds:
      - node scripts/scaffold.ts
      # What an optional component scaffolds from a contract of its own.
      - node scripts/components.ts run scaffold

  spec:check:
    desc: Gate - the contract is valid and every operation is covered by a tagged scenario
    deps: [install]
    cmds:
      - node scripts/spec-check.ts

  spec:lint:
    desc: Gate - every major's contract (specs/openapi.v<N>.yaml) meets the house rules (rules/house.yaml) and this API's own (.spectral.yaml); warnings fail
    deps: [install]
    env:
      NODE_OPTIONS: ''
    cmds:
      - node --import tsx scripts/rulesets.ts .spectral.yaml rules/house.yaml
      - |
        set -- specs/openapi.v*.yaml
        test -e "$1" || { echo "spec:lint - there is no specs/openapi.v<N>.yaml to lint"; exit 1; }
        npx spectral lint "$@" --ruleset .spectral.yaml --fail-severity warn

  mock:
    desc: Spec phase - serve a mock of every major's contract on http://127.0.0.1:4010 before anything is implemented (-- --dynamic for generated data)
    deps: [generate]
    env:
      NODE_OPTIONS: ''
    cmds:
      - npx --yes @stoplight/prism-cli@{{.PRISM_VERSION}} mock src/generated/openapi.json --port {{.MOCK_PORT}} {{.CLI_ARGS}}

  http:generate:
    desc: Write http/contract.http - a ready-to-send request for every operation in the contract
    deps: [generate]
    cmds:
      - node scripts/http-generate.ts
    sources:
      - specs/openapi.v*.yaml
      - scripts/http-generate.ts
    generates:
      - http/contract.http

  http:check:
    desc: Gate - the committed http/contract.http matches the contract (run task http:generate and commit if not)
    deps: [generate]
    cmds:
      - node scripts/http-generate.ts check

  readme:generate:
    desc: Write the README's API section from the contract - once there is a spec, the repository describes the API, not the template
    deps: [generate]
    cmds:
      - node scripts/readme.ts generate

  readme:check:
    desc: Gate - the README's API section matches the contract (run task readme:generate and commit if not)
    deps: [generate]
    cmds:
      - node scripts/readme.ts check

  http:
    desc: Explore the API by hand - pick a request from http/*.http and send it (ENV=mock|local|aws, default local; -- --all sends every one)
    deps: [http:generate]
    env:
      NODE_OPTIONS: ''
    cmds:
      - |
        set -e
        env="{{.ENV | default "local"}}"
        if [ "$env" != "local" ]; then exec npx httpyac send http/*.http --env "$env" {{.CLI_ARGS}}; fi
        # The local stack's URL and a token come from the running `task dev`.
        test -f .local/stack.json || { echo "The local stack is not running. Start it in another terminal with: task dev"; exit 1; }
        read_stack() { node -p "JSON.parse(require('fs').readFileSync('.local/stack.json','utf8')).$1"; }
        NODE_EXTRA_CA_CERTS="$(read_stack ca)" npx httpyac send http/*.http --env local \
          --var "base_url=$(read_stack base_url)" --var "token=$(read_stack token)" {{.CLI_ARGS}}

  spec:compat:
    desc: Gate - changes to the contract since the last published one are listed, and info.version is bumped to match (breaking needs a major)
    deps: [install]
    cmds:
      - node scripts/spec-compat.ts

  typecheck:
    desc: Gate - the code agrees with the types generated from the contract
    deps: [generate]
    cmds:
      - npx tsc --noEmit

  test:unit:
    desc: Gate - unit tests, including that every contract operation has a file and none is still a stub
    deps: [generate]
    cmds:
      - npx vitest run

  emulator:install:
    desc: 'Install the pinned AWS Emulator - on Linux, download it, verify AWS''s signature and unpack it into .tools/ (no sudo); on macOS and Windows, or with EMULATOR_DOCKER=1, build its Docker image'
    cmds:
      - |
        set -e
        if [ "$EMULATOR_DOCKER" = 1 ] || [ "$(uname -s)" != Linux ]; then
          docker info > /dev/null 2>&1 || { echo "AWS Emulator runs in Docker here, and Docker is not running: start Docker Desktop (or another Docker engine) and run this again"; exit 1; }
          case "$(uname -m)" in arm64|aarch64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          echo "building the AWS Emulator {{.EMULATOR_VERSION}} image, once"
          docker build -t aws-emulator:{{.EMULATOR_VERSION}} --build-arg PACKAGE=aws-emulator-{{.EMULATOR_VERSION}}-1-$arch.rpm -f local/emulator.Dockerfile local
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "AWS Emulator has no package for $(uname -m)"; exit 1 ;;
        esac
        command -v dpkg-deb >/dev/null && command -v gpgv >/dev/null || { echo "emulator:install needs dpkg-deb and gpgv; otherwise install AWS Emulator yourself so that aws-emulator is on PATH"; exit 1; }
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        package="aws-emulator_{{.EMULATOR_VERSION}}-1_$arch.deb"
        curl -fsSLo "$tmp/aws-emulator.deb" "{{.EMULATOR_BASE}}/$package"
        curl -fsSLo "$tmp/aws-emulator.deb.sig" "{{.EMULATOR_BASE}}/$package.sig"
        curl -fsSLo "$tmp/key.asc" https://downloads.aws.com/keys/gpg/current.asc
        gpg --show-keys --with-colons "$tmp/key.asc" | grep -q "^fpr:::::::::{{.EMULATOR_KEY_FINGERPRINT}}:" || { echo "the AWS publishing key does not have the expected fingerprint"; exit 1; }
        gpg --dearmor < "$tmp/key.asc" > "$tmp/key.gpg"
        # The signature must be good and made by that key - not by another the key file also holds.
        gpgv --status-fd 1 --keyring "$tmp/key.gpg" "$tmp/aws-emulator.deb.sig" "$tmp/aws-emulator.deb" > "$tmp/status"
        grep -aEq '^\[GNUPG:\] VALIDSIG ({{.EMULATOR_KEY_FINGERPRINT}} .*|.* {{.EMULATOR_KEY_FINGERPRINT}})$' "$tmp/status" || { echo "the package is not signed by the AWS publishing key"; exit 1; }
        rm -rf .tools/aws-emulator && mkdir -p .tools/aws-emulator
        dpkg-deb -x "$tmp/aws-emulator.deb" .tools/aws-emulator
        .tools/aws-emulator/opt/aws-emulator/bin/aws-emulator -v
    status:
      # Up to date when .tools/ holds the pinned version. An emulator you run
      # yourself (AWS_ENDPOINT_URL, AWS_EMULATOR_BIN) is used as it is.
      - >-
        test -n "$AWS_ENDPOINT_URL" || test -n "$AWS_EMULATOR_BIN" ||
        if [ "$EMULATOR_DOCKER" = 1 ] || [ "$(uname -s)" != Linux ]; then docker image inspect aws-emulator:{{.EMULATOR_VERSION}} > /dev/null 2>&1;
        else .tools/aws-emulator/opt/aws-emulator/bin/aws-emulator -v 2>/dev/null | grep -qx "Version: {{.EMULATOR_VERSION}}"; fi

  emulator:docker:
    desc: 'Optional: keep an empty AWS Emulator running in Docker, for your own tools - the stack tasks start a fresh one of their own, and a stack can be applied to this one only once (EMULATOR_TELEMETRY=off turns its telemetry off)'
    cmds:
      - |
        EMULATOR_DOCKER=1 task emulator:install
        mkdir -p "$HOME/.aws/emulator"
        docker run --rm --memory=2g --memory-swap=2g -p 127.0.0.1:{{.EMULATOR_PORT}}:{{.EMULATOR_PORT}} \
          -e HOME="$HOME" -e EMULATOR_TELEMETRY -v "$HOME/.aws/emulator:$HOME/.aws/emulator" aws-emulator:{{.EMULATOR_VERSION}} -p {{.EMULATOR_PORT}}

  emulator:gaps:install:
    desc: Install the AWS clients the gap tests call - a package of their own in tools/emulator, so the API's install does not carry them
    env:
      NODE_OPTIONS: ''
    cmds:
      - npm ci --prefix tools/emulator
    sources:
      - tools/emulator/package-lock.json
    generates:
      - tools/emulator/node_modules/.package-lock.json

  emulator:gaps:list:
    desc: List what AWS Emulator cannot do yet that this repository works around, lives with or waits for - each gap, what the template does about it and in which files; needs no emulator
    cmds:
      # One after another: each is an npm install, and two at once fight.
      - task: install
      - task: emulator:gaps:install
      - node tools/emulator/gaps.ts --list

  emulator:gaps:
    desc: Test each emulator gap on the pinned AWS Emulator and say "still needed" or "the gap has closed" - run when EMULATOR_VERSION moves (-- <id> tests one; Linux and CI)
    cmds:
      - task: install
      - task: emulator:gaps:install
      - task: emulator:install
      - npx tsc -p tools/emulator
      - node tools/emulator/gaps.ts {{.CLI_ARGS}}

  dev:
    desc: Run the API on AWS Emulator and keep it up - prints its URL and a token; task http then talks to it
    deps: [build, emulator:install]
    env:
      NODE_OPTIONS: ''
    cmds:
      - node local/stack.mjs

  features:
    desc: Gate - the feature files, strict, through AWS Emulator's API Gateway to the built Lambda; every response is held to the contract
    deps: [build, emulator:install]
    cmds:
      - node local/stack.mjs -- task features:run -- {{.CLI_ARGS}}

  contract:fuzz:
    desc: Gate - schemathesis generates requests from the contract (fixed seed) and checks every response conforms
    deps: [build, emulator:install]
    cmds:
      - node local/stack.mjs -- task contract:fuzz:run

  acceptance:
    desc: Gate - features, that they reach every documented response, then fuzz - one stack, infra/ applied to AWS Emulator, called through its API Gateway
    deps: [build, emulator:install]
    cmds:
      - node local/stack.mjs -- task features:run responses:check component:acceptance contract:fuzz:run

  features:run:
    desc: The feature files against a stack that is already up (BASE_URL); used by features and acceptance
    cmds:
      - npx cucumber-js {{.CLI_ARGS}}

  contract:fuzz:run:
    desc: The fuzz run against a stack that is already up (BASE_URL); used by contract:fuzz and acceptance
    cmds:
      # Start from an empty table whatever ran before.
      - node local/table.ts reset
      - >-
        uvx --from "schemathesis=={{.SCHEMATHESIS_VERSION}}" schemathesis run src/generated/openapi.json
        --url "$BASE_URL" --seed 1 --max-examples 25 --request-timeout 10
        --tls-verify "$AWS_CA_BUNDLE" -H "Authorization: Bearer $(node local/token.ts fuzz)"
        --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance

  build:
    desc: Bundle the Lambda into dist/ for infra/ to package
    deps: [generate]
    env:
      NODE_OPTIONS: ''
    cmds:
      - rm -rf dist
      - >-
        npx esbuild $(ls src/handler.ts src/consumer.ts src/forwarder.ts src/compactor.ts 2>/dev/null) --bundle --platform=node --target=node22 --format=esm
        --outdir=dist --out-extension:.js=.mjs --external:@aws-sdk/* --log-level=warning

  infra:validate:
    desc: Gate - the Terraform is formatted and valid, and its plan tests pass (infra/tests/, planned against fixture contracts with mock providers - no AWS account)
    cmds:
      - terraform -chdir=infra fmt -check -recursive
      - terraform -chdir=infra init -backend=false -input=false
      - terraform -chdir=infra validate
      - test -z "$(ls infra/tests/*.tftest.hcl 2>/dev/null)" || terraform -chdir=infra test
      - terraform -chdir=infra/bootstrap init -backend=false -input=false
      - terraform -chdir=infra/bootstrap validate

  tags:check:
    desc: Gate - no resource in infra/ that can carry tags is created without them - the aws provider's default tags, or local.tags by name for any other provider
    deps: [install]
    cmds:
      - terraform -chdir=infra init -backend=false -input=false > /dev/null
      - terraform -chdir=infra/bootstrap init -backend=false -input=false > /dev/null
      - node scripts/tags.ts check

  tags:
    desc: Show the tags every resource of a stack carries - domain, team, service, repo - and which are not yet set (NAME=<stack name>)
    env:
      NAME: '{{.NAME}}'
    cmds:
      - node scripts/tags.ts show

  ci:
    desc: Every gate, in order - the definition of done. Red until the contract and features are implemented.
    cmds:
      - task: skeleton:check
      - task: docs:check
      - task: skills:check
      - task: spec:check
      - task: spec:lint
      - task: spec:compat
      - task: http:check
      - task: readme:check
      - task: test:unit
      - task: typecheck
      - task: steps:check
      - task: infra:validate
      - task: tags:check
      - task: component:gates
      - task: acceptance

  check:
    desc: The fast gates for the stage in .stage (template, spec, implemented) - nothing started, nothing downloaded. What the pre-push hook runs.
    deps: [install]
    cmds:
      - node scripts/check.ts

  stage:
    desc: Move to the next stage once its fast gates pass, so task check and the hook run them from now on (task stage -- spec | implemented). The skills do this.
    deps: [install]
    cmds:
      - node scripts/check.ts {{.CLI_ARGS}}

  hooks:install:
    desc: Opt in to the pre-push hook - git runs task check before every push (skip one push with git push --no-verify)
    cmds:
      - git config core.hooksPath .githooks
    status:
      - test "$(git config core.hooksPath)" = ".githooks"

  # --- Your AWS account (opt-in; see "Bring your AWS account" in docs/deploying.md) ---

  aws:bootstrap:
    desc: One-off, with admin credentials - create the state bucket and the GitHub OIDC deploy role (NAME=<stack name> REPO=<owner/repo>)
    requires:
      vars: [NAME, REPO]
    cmds:
      - terraform -chdir=infra/bootstrap init -input=false
      # The same tags as the stack: the owner's from the committed file, `repo` from the git remote.
      - |
        set -e
        repo="$(node scripts/tags.ts repo)"
        terraform -chdir=infra/bootstrap apply -var-file=../tags.auto.tfvars.json -var name={{.NAME}} -var github_repository={{.REPO}} -var "repo=$repo" {{.CLI_ARGS}}

  deploy:
    desc: Build and deploy to AWS with Terraform (NAME=<stack name>; state in S3 when TF_STATE_BUCKET is set)
    deps: [build]
    requires:
      vars: [NAME]
    cmds:
      - task: aws:terraform
        vars: { ACTION: apply }

  deploy:built:
    desc: Deploy the dist/ that is already there, building nothing - what CI's deploy job runs, so no dependency is installed or run while it holds AWS credentials (NAME=<stack name>)
    requires:
      vars: [NAME]
    preconditions:
      - sh: test -f dist/handler.mjs
        msg: dist/handler.mjs is missing - this deploys a bundle built elsewhere; use task deploy to build and deploy
    cmds:
      - task: aws:terraform
        vars: { ACTION: apply }

  destroy:
    desc: Remove the deployed stack (NAME=<stack name>)
    requires:
      vars: [NAME]
    cmds:
      - task: aws:terraform
        vars: { ACTION: destroy }

  aws:terraform:
    internal: true
    cmds:
      - |
        set -e
        if [ -n "$AWS_ENDPOINT_URL" ]; then
          echo "AWS_ENDPOINT_URL is set ($AWS_ENDPOINT_URL): that is an emulator, not AWS. Unset it to deploy."
          exit 1
        fi
        # Kept apart from the .terraform the emulator runs use, so a real
        # backend and the local stack can never be confused.
        export TF_DATA_DIR="{{.ROOT_DIR}}/infra/.terraform-aws"
        if [ -n "$TF_STATE_BUCKET" ]; then
          # Remote state, configured only for this command.
          trap 'rm -f infra/backend_override.tf' EXIT
          printf 'terraform {\n  backend "s3" {}\n}\n' > infra/backend_override.tf
          terraform -chdir=infra init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key={{.NAME}}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION:-${AWS_REGION:-eu-west-2}}" \
            -backend-config="use_lockfile=true"
        else
          terraform -chdir=infra init -input=false -reconfigure
        fi
        # The `repo` tag is read from the git remote, never typed. Without the
        # project's loader: the script needs nothing installed, and CI's deploy job installs nothing.
        TF_VAR_repo="$(NODE_OPTIONS= node --experimental-strip-types --no-warnings scripts/tags.ts repo)"
        export TF_VAR_repo
        # A stack whose roles carry a permissions boundary keeps it: an apply
        # that names none - yours, from this shell - must not take it off.
        if [ -z "$TF_VAR_permissions_boundary" ]; then
          kept="$(terraform -chdir=infra output -raw permissions_boundary 2>/dev/null || true)"
          case "$kept" in arn:*) export TF_VAR_permissions_boundary="$kept" ;; *) unset TF_VAR_permissions_boundary ;; esac
        fi
        terraform -chdir=infra {{.ACTION}} -input=false -var name={{.NAME}} ${AWS_REGION:+-var region=$AWS_REGION} {{.CLI_ARGS}}
