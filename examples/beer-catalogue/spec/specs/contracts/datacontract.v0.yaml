        required: true
        logicalTypeOptions:
          minLength: 1
        description: Identifies the event; with source, unique. A consumer that sees one twice has seen the same event.
      - name: source
        classification: public
        logicalType: string
        required: true
        logicalTypeOptions:
          minLength: 1
        description: Where the event came from - the API that published it.
      - name: type
        classification: public
        logicalType: string
        required: true
      - name: time
        classification: public
        logicalType: timestamp
        required: true
        description: When it happened.
      - name: subject
        classification: public
        logicalType: string
        logicalTypeOptions:
          minLength: 1
        description: What it happened to - the identifier of the thing.
      - name: datacontenttype
        classification: public
        logicalType: string
        description: The media type of data.
      - name: dataschema
        classification: public
        logicalType: string
        logicalTypeOptions:
          format: uri
        description: Where the schema of data is published.
      - name: traceparent
        classification: internal
        logicalType: string
        logicalTypeOptions:
          pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        description: The W3C trace context of the request or message that caused the event.
      - name: data
        classification: public
        logicalType: object
        required: true
        properties:
          - name: beer_id
            classification: public
            logicalType: string
            required: true
            logicalTypeOptions:
              minLength: 1
          - name: score
            classification: public
            logicalType: integer
            required: true
            logicalTypeOptions:
              minimum: 1
              maximum: 5
            description: A whole number from 1 to 5.
  - name: beer_retired_v1
