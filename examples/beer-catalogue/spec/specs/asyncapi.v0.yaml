asyncapi: 3.1.0
info:
  title: Beer Catalogue messages
  version: 0.2.0
  description: >-
    The messages the Beer Catalogue accepts and the events it publishes.
    Ratings also arrive from elsewhere - a taproom's app - on the catalogue's
    queue. Whatever happens to a beer is published as an event. An event is
    delivered at least once, and events about one beer may arrive out of
    order: tell a repeat by the event's id, and order by its time.
channels:
  beer_ratings:
    address: beer-ratings
    description: Ratings of beers, submitted somewhere other than the catalogue's own API.
    messages:
      beer_rating_submitted_v1:
        $ref: "#/components/messages/beer_rating_submitted_v1"
  beer_events:
    address: beer-events
    description: What happened to the beers in the catalogue.
    messages:
      beer_created_v1:
        $ref: "#/components/messages/beer_created_v1"
      beer_updated_v1:
        $ref: "#/components/messages/beer_updated_v1"
      beer_retired_v1:
        $ref: "#/components/messages/beer_retired_v1"
      beer_rated_v1:
        $ref: "#/components/messages/beer_rated_v1"
operations:
  publish_beer_created_v1:
    action: send
    summary: A beer was added to the catalogue
    channel:
      $ref: "#/channels/beer_events"
    messages:
      - $ref: "#/channels/beer_events/messages/beer_created_v1"
  publish_beer_updated_v1:
    action: send
    summary: A beer's details were changed
    channel:
      $ref: "#/channels/beer_events"
    messages:
      - $ref: "#/channels/beer_events/messages/beer_updated_v1"
  publish_beer_retired_v1:
    action: send
    summary: A beer was retired from the catalogue
    channel:
      $ref: "#/channels/beer_events"
    messages:
      - $ref: "#/channels/beer_events/messages/beer_retired_v1"
  publish_beer_rated_v1:
    action: send
    summary: A beer was rated
    channel:
      $ref: "#/channels/beer_events"
    messages:
      - $ref: "#/channels/beer_events/messages/beer_rated_v1"
  receive_beer_rating_v1:
    action: receive
    summary: Record a rating that was submitted elsewhere
    channel:
      $ref: "#/channels/beer_ratings"
    messages:
      - $ref: "#/channels/beer_ratings/messages/beer_rating_submitted_v1"
components:
  messages:
    beer_rating_submitted_v1:
      name: beer_rating_submitted_v1
      title: Beer rating submitted
      summary: A drinker scored a beer.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BeerRatingSubmitted"
    beer_created_v1:
      name: beer_created_v1
      title: Beer created
      summary: A beer was added to the catalogue.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BeerCreated"
    beer_updated_v1:
      name: beer_updated_v1
      title: Beer updated
      summary: A beer's name, style or strength was changed.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BeerUpdated"
    beer_retired_v1:
      name: beer_retired_v1
      title: Beer retired
      summary: A beer was retired from the catalogue.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BeerRetired"
    beer_rated_v1:
      name: beer_rated_v1
      title: Beer rated
      summary: A drinker scored a beer.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BeerRated"
  schemas:
    BeerDetails:
      description: A beer as the catalogue describes it.
      type: object
      required: [beer_id, name, style, abv]
      additionalProperties: false
      properties:
        beer_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        style:
          type: string
          minLength: 1
        abv:
          description: Alcohol by volume, percent.
          type: number
          minimum: 0
    BeerCreated:
      allOf:
        - $ref: "../tools/asyncapi/cloudevent.yaml#/CloudEvent"
        - type: object
          required: [data]
          properties:
            type:
              type: string
              const: com.hungovercoders.beer_catalogue.beer.created.v1
            data:
              $ref: "#/components/schemas/BeerDetails"
    BeerUpdated:
      allOf:
        - $ref: "../tools/asyncapi/cloudevent.yaml#/CloudEvent"
        - type: object
          required: [data]
          properties:
            type:
              type: string
              const: com.hungovercoders.beer_catalogue.beer.updated.v1
            data:
              $ref: "#/components/schemas/BeerDetails"
    BeerRetired:
      allOf:
        - $ref: "../tools/asyncapi/cloudevent.yaml#/CloudEvent"
        - type: object
          required: [data]
          properties:
            type:
              type: string
              const: com.hungovercoders.beer_catalogue.beer.retired.v1
            data:
              type: object
              required: [beer_id, name]
              additionalProperties: false
              properties:
                beer_id:
                  type: string
                  minLength: 1
                name:
                  description: The name it had when it was retired.
                  type: string
                  minLength: 1
    BeerRated:
      allOf:
        - $ref: "../tools/asyncapi/cloudevent.yaml#/CloudEvent"
        - type: object
          required: [data]
          properties:
            type:
              type: string
              const: com.hungovercoders.beer_catalogue.beer.rated.v1
            data:
              type: object
              required: [beer_id, score]
              additionalProperties: false
              properties:
                beer_id:
                  type: string
                  minLength: 1
                score:
                  description: A whole number from 1 to 5.
                  type: integer
                  minimum: 1
                  maximum: 5
    BeerRatingSubmitted:
      allOf:
        - $ref: "../tools/asyncapi/cloudevent.yaml#/CloudEvent"
        - type: object
          required: [data]
          properties:
            type:
              type: string
              const: com.hungovercoders.taproom.beer_rating.submitted.v1
            data:
              type: object
              required: [beer_id, score]
              additionalProperties: false
              properties:
                beer_id:
                  description: The beer, by its id in the catalogue.
                  type: string
                  minLength: 1
                score:
                  description: A whole number from 1 to 5.
                  type: integer
                  minimum: 1
                  maximum: 5
