openapi: 3.1.0
info:
  title: Replace me
  version: 0.1.0
  description: >
    Replace this file with your API contract. Until it declares at least one
    operation, `task ci` fails at `spec:check` - that is the template working
    as intended.

# Add your operations here. Every operation needs an operationId, and at
# least one scenario in specs/features tagged @operation:<operationId>.
# `task spec:lint` holds this file to rules/house.yaml (lower snake_case
# names) and to your own rules in .spectral.yaml.
#
# This file is major 0 of the contract: its version is 0.x.x, its paths start
# /v0 and its operationIds end _v0 (e.g. POST /v0/things, create_thing_v0).
# A later major is a file of its own beside it - specs/openapi.v1.yaml, /v1,
# _v1 - served by the same stack, so both majors' consumers keep working.
paths: {}

# To require a signed-in caller, declare it here - for every operation, or
# under `security:` on the ones that need it - and document 401 on each:
#
# security:
#   - bearer_auth: []
#
# and under components:
#
#   securitySchemes:
#     bearer_auth:
#       type: http
#       scheme: bearer
#       bearerFormat: JWT
#   responses:
#     Unauthorized:
#       description: The caller is not signed in. API Gateway answers this itself.
#       content:
#         application/json:
#           schema:
#             type: object
#             required: [message]
#             properties:
#               message:
#                 type: string
#           example:
#             message: Unauthorized
#
# To limit how fast a caller may call each operation, say so at the root and
# document 429 on every operation - API Gateway answers it beyond the limit:
#
# x-rate-limit:
#   requests_per_second: 50
#   burst: 100
#
# and under components.responses, as Unauthorized but `message: Too Many Requests`.

components:
  schemas:
    # The error body the template's router emits (RFC 9457). Reference it
    # from every 4xx/5xx response you document.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [in, pointer, message]
            properties:
              in:
                type: string
                enum: [path, query, body]
              pointer:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: The request does not satisfy the contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          # Examples make `task mock` answer with something realistic.
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request does not satisfy the contract.
            errors:
              - in: body
                pointer: /name
                message: must be string
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: The resource does not exist.
