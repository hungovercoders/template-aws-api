name: ci

on:
  push:
    branches: [main, "example/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Every gate, exactly as you run it locally. Red by design until the
      # contract and feature files in specs/ are implemented.
      - run: task ci
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator.log 2>/dev/null || true

  # Opt-in. Skipped until the repository variable AWS_DEPLOY_ROLE_ARN is set;
  # see "Bring your AWS account" in the README. Deploys main once ci is green.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: deploy
    permissions:
      contents: read
      id-token: write # to assume the deploy role through OIDC; no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: task deploy NAME="${{ vars.STACK_NAME }}" -- -auto-approve
