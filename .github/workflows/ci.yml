name: ci

on:
  push:
    branches: [main, "example/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Green on every branch, whatever `ci` is. The gates of the stage the
  # repository has reached (.stage: template, spec, implemented) and the ones
  # that need no spec, so a branch where `ci` is red by design - nothing is
  # implemented yet - still says when something that should hold has broken.
  stage:
    name: the gates of this stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # spec:compat compares the contract with the last published one
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: task check
      - run: task infra:validate tags:check

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # spec:compat compares the contract with the last published one
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # Every gate, exactly as you run it locally. Red by design until the
      # contract and feature files in specs/ are implemented.
      - run: task ci
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator.log 2>/dev/null || true
      # The bundle the gates passed is the one deployed: the deploy job builds
      # nothing, so no dependency runs while it holds AWS credentials.
      - name: Keep the bundle for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Kept as long as any artifact, so the deploy job can be run again by
          # itself later; replaced when the whole run is.
          overwrite: true

  # Opt-in. Skipped until the repository variable AWS_DEPLOY_ROLE_ARN is set;
  # see "Bring your AWS account" in docs/deploying.md. Deploys main once ci is green.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: deploy
    permissions:
      contents: read
      id-token: write # to assume the deploy role through OIDC; no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # Only needed when the contract secures operations.
      TF_VAR_jwt_issuer: ${{ vars.JWT_ISSUER }}
      TF_VAR_jwt_audience: ${{ vars.JWT_AUDIENCE }}
      # Optional: who is told when an alarm fires.
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_alarm_topic_arn: ${{ vars.ALARM_TOPIC_ARN }}
      # Set once the bootstrap has made one: the boundary every role of the stack carries.
      TF_VAR_permissions_boundary: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
      # Optional, and only together: a limit on requests (docs/deploying.md).
      TF_VAR_throttle_rate_limit: ${{ vars.THROTTLE_RATE_LIMIT }}
      TF_VAR_throttle_burst_limit: ${{ vars.THROTTLE_BURST_LIMIT }}
      STACK_NAME: ${{ vars.STACK_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: task deploy:built NAME="$STACK_NAME" -- -auto-approve
