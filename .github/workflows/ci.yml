name: ci

on:
  push:
    branches: [main, "example/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Every gate, exactly as you run it locally. Red by design until the
      # contract and feature files in specs/ are implemented.
      - run: task ci
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator.log 2>/dev/null || true
