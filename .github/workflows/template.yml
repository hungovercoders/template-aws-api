# For the template repository itself - delete this file in an API created from it.
#
# `ci` is red on main by design: there is no spec to implement. This is the
# green signal for the skeleton instead. It makes every phase of every worked
# example (examples/<name>/<phase>, laid over the skeleton being proposed) and
# runs that phase's gates there, so a change to the skeleton - a Renovate update
# included - and any change to an example it needs are proven together.
name: template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skeleton:
    name: skeleton delivers the example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Every optional component can be removed and restored
        run: |
          # Remove them all, check what is left is still the skeleton, bring
          # them back from this very commit, and expect no difference at all.
          task install
          names=$(node --import tsx scripts/components.ts order)
          for name in $names; do task component:remove -- "$name"; done
          task skeleton:check docs:check skills:check
          for name in $(echo "$names" | tac); do task component:add -- "$name" --from "$PWD"; done
          git diff --exit-code
          task skeleton:check
      - name: Every example's spec phase passes its gates
        run: |
          for name in $(node scripts/example.ts list | cut -d: -f1); do
            task example -- "$name" spec
            (cd ".local/examples/$name-spec" && mise trust --quiet && task check)
          done
      - name: Every example's implementation passes task ci
        run: |
          for name in $(node scripts/example.ts list | cut -d: -f1); do
            task example -- "$name" implementation
            (cd ".local/examples/$name-implementation" && mise trust --quiet && task ci)
          done
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/examples/*/.local/emulator.log 2>/dev/null || true
