# For the template repository itself - delete this file in an API created from it.
#
# `ci` is red on main by design: there is no spec to implement. This is the
# green signal for the skeleton instead. It lays the example's spec and
# implementation (the example/implementation branch) over the skeleton being
# proposed and runs every gate, so a change to the skeleton - a Renovate
# update included - is proven before it is merged down.
name: template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skeleton:
    name: skeleton delivers the example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Every optional component can be removed and restored
        run: |
          # Remove them all, check what is left is still the skeleton, bring
          # them back from this very commit, and expect no difference at all.
          task install
          names=$(node --import tsx scripts/components.ts order)
          for name in $names; do task component:remove -- "$name"; done
          task skeleton:check docs:check skills:check
          for name in $(echo "$names" | tac); do task component:add -- "$name" --from "$PWD"; done
          git diff --exit-code
          task skeleton:check
      - name: Lay the example over this skeleton
        run: |
          git fetch origin example/implementation
          # Everything an API owns comes from the example...
          git checkout origin/example/implementation -- README.md specs http/contract.http messages src/operations src/consumers src/domain src/store steps test
          # Its tags are its own too. Until the example has said them, the proof says them for it.
          if git cat-file -e origin/example/implementation:infra/tags.auto.tfvars.json 2>/dev/null; then
            git checkout origin/example/implementation -- infra/tags.auto.tfvars.json
          fi
          task tags > /dev/null || echo '{ "domain": "brewing", "team": "catalogue" }' > infra/tags.auto.tfvars.json
          # ...and everything the skeleton owns stays as proposed here: every file of
          # skeleton.lock among those, so a new skeleton test is never the example's old one.
          git checkout HEAD -- $(awk '$2 ~ /^(steps|test)\// { print $2 }' skeleton.lock)
      - name: The README is written by the generator proposed here
        # The example's README was written by the generator it had, so a change to the generator
        # would always fail readme:check here. What the change does to it is shown, to be read in
        # review; the gate itself runs, unsoftened, on the example branches after the merge down.
        run: |
          task readme:generate
          git diff --stat -- README.md
          git diff -- README.md
      - run: task ci
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator.log 2>/dev/null || true
