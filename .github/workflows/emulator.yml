# When a pull request moves the AWS Emulator pin (EMULATOR_VERSION in
# Taskfile.yml), say which of the emulator's gaps are still there. The gates
# catch a release that makes something worse; this catches one that makes
# something better, so a workaround does not outlive its gap.
#
# A gap that has closed never fails the pull request. It opens an issue naming
# what can now be removed. The job is red only when a test could not tell.
name: emulator

on:
  pull_request:
    paths: [Taskfile.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaps:
    name: emulator gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # to open an issue for a gap that has closed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the pin move?
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] ||
            git diff "origin/$BASE...HEAD" -- Taskfile.yml | grep -q '^[+-]  EMULATOR_VERSION:'; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "The emulator pin did not move: nothing to test."
          fi
      - uses: jdx/mise-action@v5
        if: steps.pin.outputs.moved == 'true'
      - name: Test every gap on the proposed emulator
        if: steps.pin.outputs.moved == 'true'
        run: task emulator:gaps
      - name: Open an issue for each gap that has closed
        # A pull request from a fork has no token that may write issues; its summary above still says.
        if: steps.pin.outputs.moved == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx tools/emulator/gaps.ts --issues
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator-gaps.log 2>/dev/null || true
