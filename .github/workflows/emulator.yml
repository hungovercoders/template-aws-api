# When the AWS Emulator pin (EMULATOR_VERSION in Taskfile.yml) moves, say
# which of the emulator's gaps are still there. The gates catch a release that
# makes something worse; this catches one that makes something better, so a
# workaround does not outlive its gap.
#
# On the pull request that moves the pin it reports, on the checks page. Once
# the pin has moved on main it raises an issue for each gap that has closed,
# naming what can now be removed. A closed gap never fails anything: the job
# is red only when a test could not tell.
name: emulator

on:
  pull_request:
    paths: [Taskfile.yml]
  push:
    branches: [main]
    paths: [Taskfile.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaps:
    name: emulator gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested: ${{ steps.results.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the pin move?
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch) range="" ;;
            pull_request) range="origin/$BASE...HEAD" ;;
            *) range="$BEFORE..HEAD" ;;
          esac
          if [ -z "$range" ] || git diff "$range" -- Taskfile.yml | grep -q '^[+-]  EMULATOR_VERSION:'; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "The emulator pin did not move: nothing to test."
          fi
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.pin.outputs.moved == 'true'
      - name: Test every gap
        if: steps.pin.outputs.moved == 'true'
        run: task emulator:gaps
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator-gaps.log 2>/dev/null || true
      # Even when a test could not tell, for the gaps that did close.
      - name: Were there results?
        id: results
        if: ${{ !cancelled() && hashFiles('.local/emulator-gaps.json') != '' }}
        run: echo "tested=true" >> "$GITHUB_OUTPUT"
      - name: Keep the results for the issues job
        if: ${{ !cancelled() && steps.results.outputs.tested == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-gaps
          path: .local/emulator-gaps.json
          include-hidden-files: true
          retention-days: 1

  # A job of its own, so the token that can write issues is never there while
  # the tests - a pull request's code among them - run.
  issues:
    name: raise an issue for each gap that has closed
    needs: gaps
    # Not from a pull request: its pin may never be merged.
    if: ${{ !cancelled() && needs.gaps.outputs.tested == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is given to the one step that raises issues
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # What the script imports, and nothing run: no package's install script.
      - run: npm ci --ignore-scripts && npm ci --ignore-scripts --prefix tools/emulator
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulator-gaps
          path: .local
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx tools/emulator/gaps.ts --issues
