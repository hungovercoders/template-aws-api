# When the AWS Emulator pin (EMULATOR_VERSION in Taskfile.yml) moves, say
# which of the emulator's gaps are still there. The gates catch a release that
# makes something worse; this catches one that makes something better, so a
# workaround does not outlive its gap.
#
# On the pull request that moves the pin it reports, on the checks page. Once
# the pin has moved on main it raises an issue for each gap that has closed,
# naming what can now be removed. A closed gap never fails anything: the job
# is red only when a test could not tell.
name: emulator

on:
  pull_request:
    paths: [Taskfile.yml]
  push:
    branches: [main]
    paths: [Taskfile.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaps:
    name: emulator gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # to raise an issue for a gap that has closed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the pin move?
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch) range="" ;;
            pull_request) range="origin/$BASE...HEAD" ;;
            *) range="$BEFORE..HEAD" ;;
          esac
          if [ -z "$range" ] || git diff "$range" -- Taskfile.yml | grep -q '^[+-]  EMULATOR_VERSION:'; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "The emulator pin did not move: nothing to test."
          fi
      - uses: jdx/mise-action@v5
        if: steps.pin.outputs.moved == 'true'
      - name: Test every gap
        if: steps.pin.outputs.moved == 'true'
        run: task emulator:gaps
      - name: Raise an issue for each gap that has closed
        # Not from a pull request: its pin may never be merged. And even when a
        # test could not tell, for the gaps that did close.
        if: ${{ !cancelled() && steps.pin.outputs.moved == 'true' && github.event_name != 'pull_request' && hashFiles('.local/emulator-gaps.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx tools/emulator/gaps.ts --issues
      - name: AWS Emulator log
        if: failure()
        run: tail -n 200 .local/emulator-gaps.log 2>/dev/null || true
